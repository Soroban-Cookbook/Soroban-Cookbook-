[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"

[workspace.lints.rust]
deprecated = "allow"

[workspace.dependencies]
soroban-sdk = "28.0.0-rc.1"
base64ct = "=1.8.3"
ajo-factory = { path = "examples/intermediate/ajo-factory" }
multi-sig-patterns = { path = "examples/intermediate/multi-sig-patterns" }

[Profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[Profile.release-with-logs]
inherits = "release"
debug-assertions = true

[profile.test]
# Keep overflow checks and debug assertions active during testing so that
# arithmetic bugs surface as panics rather than silent wrapping.
opt-level = 3
debug = true
overflow-checks = true
debug-assertions = true
strip = "symbols"

[profile.bench]
inherits = "release"
