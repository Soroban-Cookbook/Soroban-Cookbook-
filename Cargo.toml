[workspace]
resolver = "2"

# The `templates/*` directories intentionally contain their own Cargo
# workspaces — each is a self-contained learner starter kit with its own
# pinned `soroban-sdk`, meant to be copied out and built standalone. Because a
# package cannot belong to two workspaces at once, they are excluded from the
# root workspace rather than listed under `members`. Build them individually:
#
#     cd templates/token-dapp && cargo build
#
# `tests/fuzz` is likewise a self-contained workspace root of its own: it
# carries its own `[workspace]`/`[workspace.dependencies]` and pins the same
# SDK, and is driven by `cargo fuzz run --fuzz-dir tests/fuzz`. Listing it
# under `members` made Cargo abort the whole workspace with "multiple
# workspace roots found in the same workspace", so it is excluded here too.
exclude = [
    "templates/dao-governance-dapp",
    "templates/nft-marketplace-dapp",
    "templates/token-dapp",
    "tests/fuzz",
]

members = [
    "shared",
    "examples/hello-world",
    "examples/intermediate/event-aggregation",
    "examples/basics/01-hello-world",
    "examples/basics/06-validation-patterns",
