name: Coverage Dashboard

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/coverage.yml"
      - "scripts/coverage-dashboard.py"
      - "tarpaulin.toml"

permissions:
  contents: read

concurrency:
  group: coverage-dashboard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: Collect coverage and update dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          # The default "-D warnings" would fail the build on lints; coverage
          # only needs the tests to run.
          rustflags: ""

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-tarpaulin

      # Tarpaulin builds every crate's tests in one go, so a single crate whose
      # tests do not compile stops the whole run. Find those crates first and
      # leave them out. The two fuzz crates are always excluded: their
      # proptest-arbitrary-interop dev-dependency does not build against the
      # latest proptest, and the failure is in a registry crate, so it cannot
      # be traced back to them here.
      - name: Find crates whose tests do not build
        run: |
          cargo build --workspace --tests --keep-going \
            --exclude fuzz-testing --exclude soroban-cookbook-fuzz \
            2>&1 | tee "$RUNNER_TEMP/build.log" || true
          # shellcheck disable=SC2016
          grep -oE 'could not compile `[^`]+`' "$RUNNER_TEMP/build.log" | cut -d'`' -f2 | sort -u > "$RUNNER_TEMP/failed.txt" || true
          cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' | sort -u > "$RUNNER_TEMP/members.txt"
          comm -12 "$RUNNER_TEMP/failed.txt" "$RUNNER_TEMP/members.txt" > "$RUNNER_TEMP/skipped.txt"
          {
            echo "### Crates left out of the coverage run"
            echo "Their tests do not build: fuzz-testing, soroban-cookbook-fuzz$(sed 's/^/, /' "$RUNNER_TEMP/skipped.txt" | tr -d '\n')"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SKIPPED=$(sed 's/^/--exclude /' "$RUNNER_TEMP/skipped.txt" | tr '\n' ' ')" >> "$GITHUB_ENV"

      # Notes on the flags:
      # - --run-types: tarpaulin skips everything under examples/ unless the
      #   Examples run type is on, which would leave every example unmeasured.
      # - --fail-under 0: tarpaulin.toml sets 90 for local use; the dashboard
      #   records the number instead of gating on it.
      # - --no-fail-fast: a failing test should not stop the report.
      - name: Collect coverage
        run: |
          status=0
          # shellcheck disable=SC2086
          ./scripts/ci-workspace.sh tarpaulin \
            --run-types Tests --run-types Examples \
            --fail-under 0 --no-fail-fast \
            --exclude fuzz-testing --exclude soroban-cookbook-fuzz \
            $SKIPPED || status=$?
          if [ ! -s coverage/cobertura.xml ]; then
            echo "::error::tarpaulin did not write a coverage report (exit status $status)"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::tarpaulin exited with status $status (failing tests); the coverage report was still written"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 90

      - name: Build dashboard
        run: |
          python3 scripts/coverage-dashboard.py coverage/cobertura.xml --commit "$GITHUB_SHA"
          mkdir "$RUNNER_TEMP/dashboard"
          cp -r docs/coverage-dashboard.md docs/coverage-data "$RUNNER_TEMP/dashboard/"

      - name: Upload dashboard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard
          path: ${{ runner.temp }}/dashboard
          retention-days: 7

  # Collection above runs read-only. Only this small job gets write access, and
  # pull requests skip it: they only prove the pipeline works, while the
  # scheduled and manual runs publish the result.
  publish:
    name: Commit dashboard
    needs: coverage
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download dashboard
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dashboard
          path: docs

      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/coverage-dashboard.md docs/coverage-data
          if git diff --cached --quiet; then
            echo "Dashboard unchanged"
            exit 0
          fi
          git commit -m "chore(coverage): update coverage dashboard"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
