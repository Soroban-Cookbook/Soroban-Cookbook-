name: Templates

# The `templates/token-dapp` and `templates/dao-governance-dapp` directories are
# intentionally standalone Cargo workspaces: each declares its own [workspace]
# with its own pinned `soroban-sdk` so a learner can copy the directory out of
# this repository and build it on its own. Because a package cannot belong to two
# workspaces at once, they are listed in the root `exclude` table instead of
# `members`, so `cargo ... --workspace` (and scripts/ci-workspace.sh) never
# touches them. Without a dedicated job like this one, a broken template would
# still ship looking official. See #1184.
#
# `templates/nft-marketplace-dapp` is a single package (not a standalone
# workspace) and is a root workspace member, so the main "Test and Lint"
# workflow (`cargo ... --workspace`) covers it; it is not built by this job.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  # actions-rust-lang/setup-rust-toolchain@v1 defaults its `rustflags` input to
  # "-D warnings", which would turn the template's legitimate uses of the
  # deprecated `Events::publish` API into hard errors. Set RUSTFLAGS here so the
  # action's guard (`! -v RUSTFLAGS`) leaves our value alone. This matches the
  # policy already used by .github/workflows/test.yml.
  RUSTFLAGS: "-D warnings -A deprecated"

jobs:
  token-dapp:
    name: token-dapp (standalone workspace)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/token-dapp
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Check the template workspace
        run: cargo check

      - name: Run the template test suite
        run: cargo test
