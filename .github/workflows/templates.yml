name: Templates

# The `templates/token-dapp` and `templates/dao-governance-dapp` directories are
# intentionally standalone Cargo workspaces: each declares its own [workspace]
# with its own pinned `soroban-sdk` so a learner can copy the directory out of
# this repository and build it on its own. Because a package cannot belong to two
# workspaces at once, they are listed in the root `exclude` table instead of
# `members`, so `cargo ... --workspace` (and scripts/ci-workspace.sh) never
# touches them. `templates/nft-marketplace-dapp` is a root workspace member.
# Without a dedicated job like this one, a broken template would still ship
# looking official. See #1184 and #1469.
#
# This job builds and tests the contracts of all three templates and verifies
# that each frontend's dependencies install and build.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  # Templates are learner starter kits and intentionally tolerate warnings
  # (deprecated APIs, unused imports, unused workspace keys). Setting this
  # also prevents setup-rust-toolchain from injecting its `-D warnings` default.
  RUSTFLAGS: "-A warnings"

jobs:
  templates:
    name: ${{ matrix.template }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - template: dao-governance-dapp
            package: dao-governance
          - template: token-dapp
            package: token-contract
          - template: nft-marketplace-dapp
            package: nft-marketplace-dapp
    defaults:
      run:
        working-directory: templates/${{ matrix.template }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable

      - name: Build template contract (release)
        run: cargo build --release -p ${{ matrix.package }}

      - name: Run template contract tests
        run: cargo test -p ${{ matrix.package }}

      - name: Setup Bun
        if: hashFiles(format('templates/{0}/frontend/package.json', matrix.template)) != ''
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        if: hashFiles(format('templates/{0}/frontend/package.json', matrix.template)) != ''
        working-directory: templates/${{ matrix.template }}/frontend
        run: bun install

      - name: Build frontend
        if: hashFiles(format('templates/{0}/frontend/package.json', matrix.template)) != ''
        working-directory: templates/${{ matrix.template }}/frontend
        run: bun run build