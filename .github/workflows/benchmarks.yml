name: Performance Benchmarks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: Soroban contract benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Run benchmark suite
        run: ./scripts/benchmark.sh --output-dir "$GITHUB_WORKSPACE/gas-benchmark-results"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gas-benchmark-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: gas-benchmark-results/
          if-no-files-found: warn
          retention-days: 90
