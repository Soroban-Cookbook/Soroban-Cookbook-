# Keeps CONTRIBUTORS.md and the book's contributors page current.
#
# Runs scripts/generate-contributors.sh after every merge to main (plus a daily
# run as a safety net, so lists are never more than 24h stale) and commits the
# result. Commits made with GITHUB_TOKEN do not re-trigger workflows.

name: Contributors

on:
  push:
    branches: [main]
    paths-ignore:
      - CONTRIBUTORS.md
      - book/src/contributors.md
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contributors
  cancel-in-progress: false

jobs:
  update:
    name: Regenerate contributor lists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # Full history: the lists are built from git shortlog.
          fetch-depth: 0

      - name: Generate
        run: |
          ./scripts/generate-contributors.sh CONTRIBUTORS.md
          ./scripts/generate-contributors.sh book/src/contributors.md

      - name: Commit if changed
        run: |
          if git diff --quiet -- CONTRIBUTORS.md book/src/contributors.md; then
            echo "Contributor lists already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CONTRIBUTORS.md book/src/contributors.md
          git commit -m "chore(contributors): regenerate contributor lists [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
