[package]
name = "integration-tests"
version.workspace = true
edition.workspace = true
publish = false

[profile.test]
opt-level = 0
split-debuginfo = "packed"

[[test]]
name = "integration_tests"
path = "integration_tests.rs"
harness = true

[[test]]
name = "snapshot_tests"
path = "tests/snapshot_tests.rs"
harness = true

[lib]
path = "lib.rs"

